name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild: moves past events out of "upcoming" and pulls the next
  # meetup from the Meetup feed. 03:15 UTC = 05:15/06:15 Athens time.
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Last known good Meetup feed: if today's fetch fails, the sync script
      # keeps this file instead of dropping the upcoming event.
      - name: Restore Meetup feed cache
        uses: actions/cache/restore@v4
        with:
          path: src/data/meetup.json
          key: meetup-feed-${{ github.run_id }}
          restore-keys: meetup-feed-

      - name: Build
        run: npm run build

      - name: Save Meetup feed cache
        if: always() && hashFiles('src/data/meetup.json') != ''
        uses: actions/cache/save@v4
        with:
          path: src/data/meetup.json
          key: meetup-feed-${{ github.run_id }}

      - name: Check event asset links
        run: npm run check:links

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows in public repos after 60 days with
  # no repository activity (e.g. a long summer break between meetups), which
  # would freeze "next up". Re-enabling the workflow through the API on each
  # scheduled run keeps the daily rebuild alive without dummy commits.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the daily schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
